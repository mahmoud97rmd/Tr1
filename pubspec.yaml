name: gold_scalper_bot
description: "A premium FinTech Flutter client for the Gold Scalper Bot v5.2."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core UI & Glassmorphism
  cupertino_icons: ^1.0.6
  glassmorphism: ^3.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & WebSockets
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.4
  
  # Security (FaceID / Fingerprint)
  local_auth: ^2.2.0
  
  # Charts & Visualizations
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
